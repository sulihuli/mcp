name: Bug in the MCP server or a plugin
description: A tool fails, an install snippet does not work, or a manifest is wrong.
labels: [bug]
body:
  - type: input
    id: client
    attributes:
      label: Client
      description: Claude, Claude Code, ChatGPT, Cursor, VS Code, Codex, Gemini CLI or other, with version.
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: The tool call or install step, what you expected and what you got. No personal data, please.
    validations:
      required: true
